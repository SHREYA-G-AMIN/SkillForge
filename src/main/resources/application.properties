spring.application.name=skillforge
server.port=${PORT:8081}

# --- Database (MySQL). DB_USERNAME and DB_PASSWORD default to root/blank if not set in environment ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillforge?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# update = Hibernate creates/updates tables automatically.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- JWT: Defaults to a secure 32-byte Base64 secret if JWT_SECRET env var is not specified ---
app.jwt.secret=${JWT_SECRET:dGhpc2lzYXZlcnlsb25nc2VjcmV0a2V5Zm9yc2tpbGxmb3JnZTIwMjY=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- CORS: comma-separated list of frontend origins ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# --- Optional admin account: created only if BOTH variables are set ---
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
