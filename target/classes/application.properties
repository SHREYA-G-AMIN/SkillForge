spring.application.name=skillforge
server.port=${PORT:8080}

# --- Database (MySQL). DB_USERNAME and DB_PASSWORD are REQUIRED environment variables ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillforge?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# update = Hibernate creates/updates tables. Use "validate" if you create the schema with database/schema.sql
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- JWT: JWT_SECRET is a REQUIRED env var (Base64, >= 32 bytes). Access token lifetime defaults to 1 hour ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- CORS: comma-separated list of frontend origins ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Optional admin account: created only if BOTH variables are set ---
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
